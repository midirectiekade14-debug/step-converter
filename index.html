<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEP Converter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
    h1 span { color: #4fc3f7; }
    .subtitle { color: #888; margin-bottom: 24px; font-size: 0.9rem; }
    
    .drop-zone {
      border: 2px dashed #333; border-radius: 12px; padding: 60px 20px;
      text-align: center; cursor: pointer; transition: all 0.2s;
      background: #111; margin-bottom: 24px;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: #4fc3f7; background: #0d1b2a; }
    .drop-zone .icon { font-size: 48px; margin-bottom: 12px; }
    .drop-zone p { color: #888; }
    .drop-zone .filename { color: #4fc3f7; font-weight: 600; margin-top: 8px; }
    
    .controls { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
    .format-btn {
      padding: 8px 20px; border: 1px solid #333; border-radius: 8px;
      background: #1a1a1a; color: #ccc; cursor: pointer; font-size: 0.9rem;
      transition: all 0.2s;
    }
    .format-btn:hover { border-color: #4fc3f7; color: #fff; }
    .format-btn.active { background: #4fc3f7; color: #000; border-color: #4fc3f7; font-weight: 600; }
    
    .convert-btn {
      padding: 10px 32px; border: none; border-radius: 8px;
      background: #4fc3f7; color: #000; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: all 0.2s;
    }
    .convert-btn:hover { background: #81d4fa; }
    .convert-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .layout { display: flex; gap: 24px; }
    .preview-panel { flex: 1; min-height: 400px; background: #111; border-radius: 12px; position: relative; overflow: hidden; }
    .preview-panel canvas { width: 100% !important; height: 100% !important; display: block; }
    
    .preview-toolbar {
      position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 10;
    }
    .toolbar-btn {
      padding: 6px 12px; border: 1px solid #444; border-radius: 6px;
      background: rgba(26,26,26,0.85); color: #ccc; cursor: pointer; font-size: 0.8rem;
      backdrop-filter: blur(4px); transition: all 0.2s;
    }
    .toolbar-btn:hover { border-color: #4fc3f7; color: #fff; }
    .toolbar-btn.active { background: rgba(79,195,247,0.2); border-color: #4fc3f7; color: #4fc3f7; }
    
    .sidebar { width: 320px; display: flex; flex-direction: column; gap: 16px; }
    
    .mesh-info {
      background: #111; border-radius: 8px; padding: 16px; border: 1px solid #222;
      display: none;
    }
    .mesh-info.active { display: block; }
    .mesh-info h3 { font-size: 0.9rem; color: #4fc3f7; margin-bottom: 8px; }
    .mesh-info .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.85rem; }
    .mesh-info .row .label { color: #888; }
    .mesh-info .row .value { color: #e0e0e0; font-weight: 600; }
    
    .result-card {
      background: #111; border-radius: 8px; padding: 16px; margin-bottom: 12px;
      border: 1px solid #222;
    }
    .result-card .format { font-weight: 700; color: #4fc3f7; margin-bottom: 4px; }
    .result-card .info { color: #888; font-size: 0.85rem; margin-bottom: 8px; }
    .result-card a {
      display: inline-block; padding: 6px 16px; background: #1a1a1a;
      border: 1px solid #333; border-radius: 6px; color: #4fc3f7;
      text-decoration: none; font-size: 0.85rem; transition: all 0.2s;
    }
    .result-card a:hover { background: #222; border-color: #4fc3f7; }
    
    .progress { display: none; margin-bottom: 24px; }
    .progress.active { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .spinner {
      width: 24px; height: 24px; border: 3px solid #333; border-top-color: #4fc3f7;
      border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar { flex: 1; min-width: 200px; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
    .progress-bar .fill { height: 100%; background: #4fc3f7; transition: width 0.3s; width: 0%; }
    .progress-text { width: 100%; color: #888; font-size: 0.85rem; margin-top: 2px; }
    
    .error { color: #ef5350; background: #1a0000; border: 1px solid #ef5350; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .error.active { display: block; }
    
    .shortcuts { position: fixed; bottom: 16px; right: 16px; background: rgba(17,17,17,0.9); border: 1px solid #333; border-radius: 8px; padding: 12px 16px; font-size: 0.75rem; color: #666; backdrop-filter: blur(4px); }
    .shortcuts kbd { background: #222; padding: 2px 6px; border-radius: 3px; color: #999; border: 1px solid #444; font-family: inherit; }
    
    @media (max-width: 768px) { .layout { flex-direction: column; } .sidebar { width: 100%; } .shortcuts { display: none; } }
  </style>
</head>
<body>
  <div class="container">
    <h1><span>3D</span> Converter</h1>
    <p class="subtitle">Upload CAD of 3D bestand (STEP, IGES, SKP, FBX, OBJ, 3DS, DAE, PLY, BLEND, GLTF, etc.) → preview + export 🚀</p>
    
    <div class="drop-zone" id="dropZone">
      <div class="icon">📦</div>
      <p>Sleep een 3D/CAD bestand hier of klik</p>
      <p class="filename" id="fileName"></p>
      <input type="file" id="fileInput" accept=".stp,.step,.skp,.fbx,.obj,.3ds,.dae,.ply,.blend,.gltf,.glb,.iges,.igs,.stl,.dxf,.gcode,.usdz" hidden>
    </div>
    
    <div class="error" id="errorBox"></div>
    
    <div class="controls">
      <button class="format-btn active" data-format="obj">OBJ</button>
      <button class="format-btn active" data-format="stl">STL</button>
      <button class="format-btn active" data-format="dxf">DXF</button>
      <button class="format-btn active" data-format="glb">GLB</button>
      <button class="format-btn" data-format="gltf">GLTF</button>
      <button class="format-btn" data-format="ply">PLY</button>
      <button class="convert-btn" id="convertBtn" disabled>Converteer</button>
    </div>
    
    <div class="progress" id="progress">
      <div class="spinner" id="spinner"></div>
      <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
      <p class="progress-text" id="progressText">Laden...</p>
    </div>
    
    <div class="layout">
      <div class="preview-panel" id="previewPanel">
        <div class="preview-toolbar" id="previewToolbar" style="display:none">
          <button class="toolbar-btn" id="btnWireframe" title="Wireframe toggle (W)">Wireframe</button>
          <button class="toolbar-btn" id="btnResetCam" title="Camera reset (R)">Reset cam</button>
        </div>
      </div>
      <div class="sidebar">
        <div class="mesh-info" id="meshInfo">
          <h3>📐 Mesh Info</h3>
          <div class="row"><span class="label">Vertices</span><span class="value" id="infoVerts">—</span></div>
          <div class="row"><span class="label">Faces</span><span class="value" id="infoFaces">—</span></div>
          <div class="row"><span class="label">Bodies</span><span class="value" id="infoBodies">—</span></div>
          <div class="row"><span class="label">Afmetingen</span><span class="value" id="infoDims">—</span></div>
          <div class="row"><span class="label">Bestandsgrootte</span><span class="value" id="infoSize">—</span></div>
        </div>
        <div id="results"></div>
      </div>
    </div>
  </div>

  <div class="shortcuts">
    <kbd>W</kbd> Wireframe &nbsp; <kbd>R</kbd> Reset camera
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/assimpjs@0.0.10/dist/assimpjs.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
